services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: volunteer
      POSTGRES_USER: volunteer
      POSTGRES_PASSWORD: volunteer
    ports:
      - "5432:5432"
    volumes:
      - volunteer-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U volunteer -d volunteer"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  volunteer-postgres-data:
